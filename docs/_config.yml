title: godot-box3d-embedded
description: Downstream Box3D physics for Godot 4 with static Web embedding and worker-main support
version: downstream

# Styling follows box2d.org/documentation3d, so the two sets of docs feel related.
# No remote theme: the layout in _layouts/default.html is self-contained.

repository: waskosky/godot-box3d-embedded
github_url: https://github.com/waskosky/godot-box3d-embedded

# Pages become directories, so nav URLs and in-page links are both extensionless.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      permalink: /:basename/

nav:
  - title: Overview
    url: /
  - title: Installation
    url: /installation/
  - title: Demos
    url: /demos/
  - title: Benchmarks
    url: /benchmarks/
  - title: Behavior differences
    url: /behavior-differences/
  - title: Comparison
    url: /comparison/
  - title: Building
    url: /building/
  - title: Static Web embedding
    url: /static-embedding/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
