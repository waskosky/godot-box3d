name: Portable Android iOS Web Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source package
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/verify_port.py

  android:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: android-actions/setup-android@v4

      - name: Set up pinned SCons
        run: scripts/setup_python_build_env.sh

      - name: Bootstrap dependencies
        run: scripts/bootstrap_dependencies.sh

      - name: Install pinned Android toolchain
        run: scripts/setup_android_toolchain.sh

      - name: Build Android matrix
        env:
          JOBS: 4
        run: scripts/build_android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: portable-android
          path: bin/android/*
          if-no-files-found: error

  ios:
    needs: validate
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Set up pinned SCons
        run: scripts/setup_python_build_env.sh

      - name: Bootstrap dependencies
        run: scripts/bootstrap_dependencies.sh

      - name: Build iOS matrix
        env:
          JOBS: 4
        run: scripts/build_ios.sh

      - uses: actions/upload-artifact@v7
        with:
          name: portable-ios
          path: bin/ios/*
          if-no-files-found: error

  web-extension:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Set up pinned SCons
        run: scripts/setup_python_build_env.sh

      - name: Bootstrap dependencies
        run: scripts/bootstrap_dependencies.sh

      - name: Install pinned Emscripten
        run: scripts/setup_web_toolchain.sh

      - name: Build Web extension matrix
        env:
          JOBS: 4
        run: scripts/build_web.sh

      - uses: actions/upload-artifact@v7
        with:
          name: portable-web-extension
          path: bin/web/*
          if-no-files-found: error

  web-templates:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config

      - name: Set up pinned SCons
        run: scripts/setup_python_build_env.sh

      - name: Install pinned Emscripten
        run: scripts/setup_web_toolchain.sh

      - name: Build dynamic-link Web templates
        env:
          JOBS: 4
        run: scripts/build_web_templates.sh

      - uses: actions/upload-artifact@v7
        with:
          name: portable-web-templates
          path: dist/web-export-templates/*
          if-no-files-found: error

  web-package:
    needs: [web-extension, web-templates, web-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: portable-web-extension
          path: bin/web

      - uses: actions/download-artifact@v8
        with:
          name: portable-web-templates
          path: dist/web-export-templates

      - name: Validate and package Web support
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python3 scripts/verify_port.py --platform web --require-binaries
          python3 scripts/package_addon.py \
            --mode bundle \
            --platform web \
            --web-templates-dir dist/web-export-templates \
            --output dist/godot-box3d-web-release.zip

      - uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-web-release
          path: dist/godot-box3d-web-release.zip
          if-no-files-found: error
          retention-days: 30

  web-smoke:
    needs: [web-extension, web-templates]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_ZIP_NAME: Godot_v4.7-stable_linux.x86_64
      GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: portable-web-extension
          path: bin/web

      - uses: actions/download-artifact@v8
        with:
          name: portable-web-templates
          path: dist/web-export-templates

      - name: Install Godot and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP_NAME}.zip"
          unzip -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$GODOT_BIN"
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Export release smoke project
        run: |
          mkdir -p test_project/addons/godot-box3d/bin/web build/web-smoke-release
          cp bin/web/*.wasm test_project/addons/godot-box3d/bin/web/
          "$GODOT_BIN" --headless \
            --path test_project \
            --export-release "Web Box3D Smoke" \
            ../build/web-smoke-release/index.html

      - name: Run Chromium smoke
        run: |
          python3 scripts/run_web_smoke.py \
            --dir build/web-smoke-release \
            --screenshot build/web-smoke-release.png

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-smoke-result
          path: build/web-smoke-release.png
          if-no-files-found: warn
          retention-days: 30

  package:
    needs: [android, ios, web-extension, web-templates, web-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: portable-android
          path: bin/android

      - uses: actions/download-artifact@v8
        with:
          name: portable-ios
          path: bin/ios

      - uses: actions/download-artifact@v8
        with:
          name: portable-web-extension
          path: bin/web

      - uses: actions/download-artifact@v8
        with:
          name: portable-web-templates
          path: dist/web-export-templates

      - name: Validate complete artifact matrix
        run: |
          python3 scripts/verify_port.py \
            --platform android \
            --platform ios \
            --platform web \
            --require-binaries

      - name: Create the single developer release bundle
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python3 scripts/package_addon.py \
            --mode bundle \
            --platform android \
            --platform ios \
            --platform web \
            --web-templates-dir dist/web-export-templates \
            --output dist/godot-box3d-portable-release.zip

      - uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-portable-release
          path: dist/godot-box3d-portable-release.zip
          if-no-files-found: error
          retention-days: 30
