name: Static Web build and physics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GODOT_ARCHIVE: Godot_v4.7-stable_linux.x86_64
      GODOT_SHA512: b639ca9c1ddea39bb3df89bd5283a51ca6047467abe6b25e9436566f2b2082ede633025073989ecf39c7d5d3c2493d80ea13e3af6dd5e261bbf89e462d6d2214
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore engine compilation cache
        id: engine-cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/godot-static-4.7-stable
          key: box3d-static-engine-v1-${{ runner.os }}-${{ hashFiles('dependencies.lock', 'scripts/build_web_static_templates.sh', 'patches/godot-4.7/web-worker-readback.patch', 'examples/godot_static/box3d_static/*') }}

      - name: Set up pinned build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git pkg-config unzip
          scripts/setup_python_build_env.sh
          scripts/bootstrap_dependencies.sh
          scripts/setup_web_toolchain.sh

      - name: Build matching Release and Debug hosts
        env:
          MAX_JOBS: 4
        run: scripts/build_web_static_templates.sh

      - name: Save compiled engine before browser qualification
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/godot-static-4.7-stable
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}

      - name: Install Godot and browsers
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/${GODOT_ARCHIVE}.zip"
          printf '%s  %s\n' "$GODOT_SHA512" "$RUNNER_TEMP/godot.zip" | sha512sum --check -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/$GODOT_ARCHIVE"
          .venv/bin/python -m pip install playwright==1.61.0
          .venv/bin/python -m playwright install --with-deps chromium firefox

      - name: Export both profiles and run physics smoke
        run: |
          for target in release debug; do
            .venv/bin/python scripts/export_web_smoke.py \
              --godot "$RUNNER_TEMP/godot/$GODOT_ARCHIVE" \
              --profile static --target "$target" \
              --template "dist/web-static-templates/templates/godot-box3d-static-web-$target.zip" \
              --output "build/static-web-$target"
            for browser in chromium firefox; do
              .venv/bin/python scripts/run_web_smoke.py \
                --dir "build/static-web-$target" --browser "$browser" --timeout 180 \
                --output "build/static-web-results/$target-$browser.json" \
                --screenshot "build/static-web-results/$target-$browser.png"
            done
          done

      - name: Check Release physics and cleanup under sustained workload
        run: |
          for browser in chromium firefox; do
            .venv/bin/python scripts/run_web_stress.py \
              --dir build/static-web-release --browser "$browser" \
              --output "build/static-web-results/workload-$browser.json"
          done

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: godot-box3d-embedded-static-web
          path: |
            dist/web-static-templates/godot-box3d-embedded-static-web.zip
            dist/web-static-templates/godot-box3d-embedded-static-web.zip.sha256
            dist/web-static-templates/BUILD_MANIFEST.json
            build/static-web-results/
          if-no-files-found: error
          retention-days: 90
