name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake-generator: Ninja
            godot-archive: Godot_v4.7-stable_linux.x86_64.zip
            godot-executable: Godot_v4.7-stable_linux.x86_64
          - os: windows-latest
            cmake-generator: Ninja
            godot-archive: Godot_v4.7-stable_win64.exe.zip
            godot-executable: Godot_v4.7-stable_win64.exe
          - os: macos-latest
            cmake-generator: Ninja
            godot-archive: Godot_v4.7-stable_macos.universal.zip
            godot-executable: Godot.app/Contents/MacOS/Godot

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl ninja-build unzip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -B build -G "${{ matrix.cmake-generator }}"

      - name: Configure universal macOS build
        if: runner.os == 'macOS'
        run: >-
          cmake -B build -G "${{ matrix.cmake-generator }}"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Verify universal macOS binary
        if: runner.os == 'macOS'
        run: lipo bin/libgodot-box3d.dylib -verify_arch arm64 x86_64

      - name: Install Godot
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
          GODOT_ARCHIVE: ${{ matrix.godot-archive }}
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}"
          unzip -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${{ matrix.godot-executable }}"

      - name: Run headless tests
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/${{ matrix.godot-executable }}
          TEST_SUMMARY: ${{ runner.temp }}/test-summary.md
          BUILD_DIR: ${{ github.workspace }}/build
        run: scripts/run_headless_tests.sh

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/test-summary.md" ]]; then
            cat "$RUNNER_TEMP/test-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Tests did not run' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-${{ runner.os }}
          path: bin/

  compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl ninja-build unzip

      - name: Install minimum supported Godot
        shell: bash
        env:
          GODOT_VERSION: 4.3-stable
          GODOT_ARCHIVE: Godot_v4.3-stable_linux.x86_64.zip
          GODOT_EXECUTABLE: Godot_v4.3-stable_linux.x86_64
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}"
          unzip -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${GODOT_EXECUTABLE}"

      - name: Run minimum-version headless tests
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.3-stable_linux.x86_64
          TEST_SUMMARY: ${{ runner.temp }}/test-summary.md
        run: scripts/run_headless_tests.sh

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/test-summary.md" ]]; then
            cat "$RUNNER_TEMP/test-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Minimum-version tests did not run' >> "$GITHUB_STEP_SUMMARY"
          fi

  sanitizer-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Configure ASan and UBSan build
        run: >-
          cmake -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build with ASan and UBSan
        run: cmake --build build-sanitized --target godot-box3d --parallel

  undefined-behavior:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl ninja-build unzip

      - name: Install Godot
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
          GODOT_ARCHIVE: Godot_v4.7-stable_linux.x86_64.zip
          GODOT_EXECUTABLE: Godot_v4.7-stable_linux.x86_64
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}"
          unzip -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${GODOT_EXECUTABLE}"

      - name: Configure UBSan build
        # Box3D's x86 SIMD loader intentionally uses movsd through a double-pointer
        # intrinsic on float-aligned data, which GCC's alignment instrumentation
        # diagnoses even though the instruction accepts it. Exercise Box3D's supported
        # scalar path here so every UBSan category stays enabled for all C and C++ code.
        # The regular native and Web jobs exercise the production SIMD path.
        run: >-
          cmake -B build-ubsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBOX3D_DISABLE_SIMD=ON
          -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=undefined"

      - name: Run headless tests with UBSan
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7-stable_linux.x86_64
          BUILD_DIR: ${{ github.workspace }}/build-ubsan
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: scripts/run_headless_tests.sh

  release:
    needs: [build, compatibility, sanitizer-build, undefined-behavior]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Filenames differ per platform, so the three artifacts flatten into one bin/ cleanly.
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: godot-box3d-*
          merge-multiple: true
          path: bin

      - name: Assemble addon
        run: |
          mkdir -p addon/addons/godot-box3d/bin
          cp test_project/addons/godot-box3d/godot-box3d.gdextension addon/addons/godot-box3d/
          cp LICENSE addon/addons/godot-box3d/
          cp bin/libgodot-box3d.so bin/godot-box3d.dll bin/libgodot-box3d.dylib \
            addon/addons/godot-box3d/bin/
          cd addon && zip -r ../godot-box3d-${{ github.ref_name }}.zip addons

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: godot-box3d-${{ github.ref_name }}.zip
          generate_release_notes: true
